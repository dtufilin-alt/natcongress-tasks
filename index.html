<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Нацконгресс · Задачи</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#17233a;font:15px system-ui,sans-serif}main{max-width:1300px;margin:40px auto;padding:0 22px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin-bottom:6px}.muted{color:#65738a}nav{display:flex;gap:8px;margin:28px 0 20px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #ced7e3;border-radius:9px;padding:10px 16px;background:white;color:#17233a}button.active,button.primary{background:#244fdd;color:white;border-color:#244fdd}.panel{background:white;border:1px solid #dfe5ee;border-radius:14px;padding:20px}.toolbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px}input:not([type=checkbox]),select,textarea{border:1px solid #cbd4e2;border-radius:7px;padding:9px;background:white;color:inherit;max-width:100%}input[type=checkbox]{width:19px;height:19px;accent-color:#244fdd;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px 9px;border-bottom:1px solid #e5eaf1;vertical-align:top}th{font-size:12px;color:#65738a;text-transform:uppercase}td small{display:block;color:#65738a;max-width:370px;margin-top:3px;line-height:1.3}tbody tr:hover,tbody tr:focus-within{background:#edf3ff}tbody tr.overdue{background:#fff1f2}tbody tr.overdue:hover,tbody tr.overdue:focus-within{background:#ffe0e4}tr.overdue td:first-child{box-shadow:inset 3px 0 #dc2626}.overdue-label{color:#b91c1c;font-weight:600}tr.done .title{text-decoration:line-through;color:#7e8ba0}.tablewrap{overflow:auto}td button{padding:6px 10px}.row-actions{white-space:nowrap}td .delete-task{color:#b91c1c;border-color:#fecaca;background:#fff1f2;font-weight:700;font-size:20px;line-height:1;padding:7px 10px;vertical-align:middle}td .delete-task:hover{background:#fee2e2;border-color:#ef4444}.badge{display:inline-block;background:#edf2ff;padding:4px 8px;border-radius:6px;white-space:nowrap}.action-mark{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#fee2e2;color:#b91c1c;font-weight:800}.high{background:#fff0e8;color:#a44416}form{max-width:730px;display:grid;gap:18px}form label{display:grid;gap:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.check{display:flex!important;align-items:center;gap:9px}textarea{min-height:90px}#notice{min-height:25px;margin:12px 0;color:#a23b28}[hidden]{display:none!important}@media(max-width:600px){main{margin:22px auto;padding:0 12px}h1{font-size:25px}.grid{grid-template-columns:1fr}.panel{padding:12px}th,td{padding:7px 6px}}
</style><main><header><div><span class="muted">Подготовка мероприятия</span><h1>Нацконгресс</h1><div id="stats" class="muted"></div></div></header>
<nav aria-label="Разделы"><button id="listTab" class="active">Список задач</button><button id="newTab">Новая задача</button></nav><div class="muted">Приоритеты и признак «Требует действий» выставлены предварительно. Неизвестные сроки и ответственные не назначены.</div><div id="notice" role="status" aria-live="polite"></div>
<section id="list" class="panel"><div class="toolbar"><input id="search" aria-label="Поиск задач" placeholder="Найти задачу или ответственного"><select id="onlyAction" aria-label="Фильтр по необходимости действий"><option value="all">Все задачи</option><option value="action">Требуют действий</option></select><label class="check"><input id="hideDone" type="checkbox">Скрыть выполненные</label></div><div class="toolbar"><button id="export">Экспорт JSON</button><button id="import">Импорт JSON</button><input id="importFile" type="file" accept="application/json,.json" hidden><span class="muted">Изменения сохраняются в этом браузере, не синхронизируются между устройствами.</span></div><div class="tablewrap"><table><thead><tr><th>Готово</th><th>Задача</th><th>Ответственный</th><th>Срок</th><th>Приоритет</th><th>Требует действий</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="new" class="panel" hidden><h2 id="formTitle">Новая задача</h2><form id="form"><label>Задача<input name="title" required maxlength="500" placeholder="Что нужно сделать"></label><div class="grid"><label>Ответственный<input name="owner" maxlength="200" placeholder="Не назначен"></label><label>Срок<input name="due" type="date"></label></div><label>Приоритет<select name="priority"><option>Средний</option><option>Высокий</option><option>Низкий</option></select></label><label id="actionField" class="check"><input name="action" type="checkbox" checked>Требует действий</label><label>Комментарий / текущий статус<textarea name="notes" maxlength="3000"></textarea></label><div><button class="primary" id="save">Добавить задачу</button> <button type="button" id="cancel">Отмена</button></div></form></section></main>
<script>
let tasks=[],editing=null;const $=id=>document.getElementById(id),f=$('form'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tab(name){$('list').hidden=name!=='list';$('new').hidden=name!=='new';$('listTab').classList.toggle('active',name==='list');$('newTab').classList.toggle('active',name==='new')}
function newTask(){editing=null;f.reset();$('actionField').hidden=false;$('formTitle').textContent='Новая задача';$('save').textContent='Добавить задачу';tab('new')}
$('listTab').onclick=()=>tab('list');$('newTab').onclick=newTask;$('cancel').onclick=()=>tab('list');
function todayMoscow(now=new Date()){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);const value=k=>p.find(x=>x.type===k).value;return `${value('year')}-${value('month')}-${value('day')}`}
function isOverdue(task,today=todayMoscow()){return !task.done&&!!task.due&&task.due<today}
function compareTasks(a,b){if(a.done!==b.done)return Number(a.done)-Number(b.done);if(a.done)return 0;return (a.due||'9999-12-31').localeCompare(b.due||'9999-12-31')}
function render(){const today=todayMoscow();const done=tasks.filter(t=>t.done).length;$('stats').textContent=`${tasks.length} задач · ${done} выполнено · ${tasks.filter(t=>!t.done&&t.action).length} требуют действий`;const query=$('search').value.toLowerCase();const filtered=tasks.filter(t=>($('onlyAction').value!=='action'||t.action&&!t.done)&&(!$('hideDone').checked||!t.done)&&(t.title+' '+t.owner+' '+t.notes).toLowerCase().includes(query)).sort(compareTasks);$('rows').innerHTML=filtered.map(t=>`<tr class="${t.done?'done':isOverdue(t,today)?'overdue':''}"><td><input type="checkbox" data-id="${esc(t.id)}" data-kind="done" ${t.done?'checked':''} aria-label="Выполнено: ${esc(t.title)}"></td><td><strong class="title">${esc(t.title)}</strong><small>${esc(t.notes)}</small></td><td>${esc(t.owner||'Не назначен')}</td><td style="white-space:nowrap">${t.due?esc(t.due.split('-').reverse().join('.')):'Не указан'}${isOverdue(t,today)?'<small class="overdue-label">Просрочено</small>':''}</td><td><span class="badge ${t.priority==='Высокий'?'high':''}">${esc(t.priority)}</span></td><td>${t.action&&!t.done?'<span class="action-mark" role="img" aria-label="Требует действий" title="Требует действий">!</span>':''}</td><td class="row-actions"><button data-edit="${esc(t.id)}">Изменить</button> <button type="button" class="delete-task" data-delete="${esc(t.id)}" aria-label="Удалить задачу: ${esc(t.title)}" title="Удалить задачу">×</button></td></tr>`).join('')||'<tr><td colspan="7">Задач не найдено</td></tr>'}
const STORAGE_KEY='natcongress-tasks-v1';
async function save(task){const saved={...task,id:task.id||crypto.randomUUID()},next=tasks.map(t=>({...t})),idx=next.findIndex(t=>t.id===saved.id);if(idx<0)next.push(saved);else next[idx]=saved;localStorage.setItem(STORAGE_KEY,JSON.stringify(next));tasks=next;render();$('notice').textContent='Сохранено в этом браузере';}
$('rows').onchange=async e=>{const el=e.target;if(!el.dataset.kind)return;el.disabled=true;try{const task={...tasks.find(t=>t.id===el.dataset.id),[el.dataset.kind]:el.checked};if(task.done)task.action=false;await save(task)}catch(err){$('notice').textContent=err.message;render()}};
function deleteTask(id){const task=tasks.find(t=>t.id===id);if(!task)return;if(!confirm(`Действительно хотите удалить задачу «${task.title}»?`))return;try{const next=tasks.filter(t=>t.id!==id);localStorage.setItem(STORAGE_KEY,JSON.stringify(next));tasks=next;if(editing?.id===id){editing=null;f.reset()}render();$('notice').textContent='Задача удалена'}catch(err){$('notice').textContent='Не удалось сохранить удаление. Задача оставлена в списке.'}}
$('rows').onclick=e=>{const deleteId=e.target.dataset.delete;if(deleteId){deleteTask(deleteId);return}const id=e.target.dataset.edit;if(!id)return;editing=tasks.find(t=>t.id===id);for(const k of ['title','owner','due','priority','notes'])f.elements[k].value=editing[k];f.elements.action.checked=editing.action;$('actionField').hidden=false;$('formTitle').textContent='Редактирование задачи';$('save').textContent='Сохранить';tab('new')};
f.onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{const task={id:editing?.id,title:f.elements.title.value.trim(),owner:f.elements.owner.value.trim(),due:f.elements.due.value,priority:f.elements.priority.value,notes:f.elements.notes.value.trim(),done:editing?.done||false,action:f.elements.action.checked};if(!task.title)throw Error('Введите название задачи');if(task.done)task.action=false;await save(task);tab('list')}catch(err){$('notice').textContent=err.message}finally{$('save').disabled=false}};
for(const id of ['search','onlyAction','hideDone'])$(id).oninput=render;

function validate(data){return Array.isArray(data)&&data.every(t=>t&&typeof t.id==='string'&&['title','owner','due','notes'].every(k=>typeof t[k]==='string')&&t.title.trim()&&['Высокий','Средний','Низкий'].includes(t.priority)&&typeof t.done==='boolean'&&typeof t.action==='boolean')&&new Set(data.map(t=>t.id)).size===data.length}
try{const stored=localStorage.getItem(STORAGE_KEY);tasks=stored?JSON.parse(stored):initialTasks;if(!validate(tasks))throw Error();render()}catch(e){tasks=initialTasks;render();$('notice').textContent='Не удалось прочитать сохранение. Показан исходный список; повреждённые данные не перезаписаны.'}
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='natcongress-tasks-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!validate(data))throw Error('Некорректный файл задач');if(!confirm('Заменить текущий список задач данными из файла?'))return;localStorage.setItem(STORAGE_KEY,JSON.stringify(data));tasks=data;render();$('notice').textContent='Задачи импортированы'}catch(err){$('notice').textContent='Импорт не выполнен: '+err.message}finally{e.target.value=''}};
let displayedDay=todayMoscow();function refreshDay(){const day=todayMoscow();if(day!==displayedDay){displayedDay=day;render()}}setInterval(refreshDay,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDay()});
