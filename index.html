</style><main><header><div><span class="muted">Подготовка мероприятия</span><h1>Нацконгресс</h1><div id="stats" class="muted"></div></div></header>

<section id="list" class="panel"><div class="toolbar"><input id="search" aria-label="Поиск задач" placeholder="Найти задачу или ответственного"><select id="onlyAction" aria-label="Фильтр по необходимости действий"><option value="all">Все задачи</option><option value="action">Требуют действий</option></select><label class="check"><input id="hideDone" type="checkbox">Скрыть выполненные</label></div><div class="toolbar"><button id="export">Экспорт JSON</button><button id="import">Импорт JSON в общий список</button><button id="migrateLocal" hidden>Перенести мои задачи</button><button id="exportLocal" hidden>Скачать прежний список</button><input id="importFile" type="file" accept="application/json,.json" hidden><span class="muted">Общий список · обновляется автоматически. <span id="syncStatus" role="status">Подключение…</span></span></div><div class="tablewrap"><table><thead><tr><th>Готово</th><th>Задача</th><th>Ответственный</th><th>Срок</th><th>Приоритет</th><th>Требует действий</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="new" class="panel" hidden><h2 id="formTitle">Новая задача</h2><form id="form"><label>Задача<input name="title" required maxlength="500" placeholder="Что нужно сделать"></label><div class="grid"><label>Ответственный<input name="owner" maxlength="200" placeholder="Не назначен"></label><label>Срок<input name="due" type="date"></label></div><label>Приоритет<select name="priority"><option>Средний</option><option>Высокий</option><option>Низкий</option></select></label><label id="actionField" class="check"><input name="action" type="checkbox" checked>Требует действий</label><label>Комментарий / текущий статус<textarea name="notes" maxlength="3000"></textarea></label><div><button class="primary" id="save">Добавить задачу</button> <button type="button" id="cancel">Отмена</button></div></form></section></main>

<script>
let tasks=[],editing=null;const $=id=>document.getElementById(id),f=$('form'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tab(name){$('list').hidden=name!=='list';$('new').hidden=name!=='new';$('listTab').classList.toggle('active',name==='list');$('newTab').classList.toggle('active',name==='new')}
function newTask(){editing=null;f.reset();$('actionField').hidden=false;$('formTitle').textContent='Новая задача';$('save').textContent='Добавить задачу';tab('new')}
$('listTab').onclick=()=>tab('list');$('newTab').onclick=newTask;$('cancel').onclick=()=>tab('list');
function todayMoscow(now=new Date()){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);const value=k=>p.find(x=>x.type===k).value;return `${value('year')}-${value('month')}-${value('day')}`}
function isOverdue(task,today=todayMoscow()){return !task.done&&!!task.due&&task.due<today}
function compareTasks(a,b){if(a.done!==b.done)return Number(a.done)-Number(b.done);if(a.done)return 0;return (a.due||'9999-12-31').localeCompare(b.due||'9999-12-31')}
function render(){const today=todayMoscow();const done=tasks.filter(t=>t.done).length;$('stats').textContent=`${tasks.length} задач · ${done} выполнено · ${tasks.filter(t=>!t.done&&t.action).length} требуют действий`;const query=$('search').value.toLowerCase();const filtered=tasks.filter(t=>($('onlyAction').value!=='action'||t.action&&!t.done)&&(!$('hideDone').checked||!t.done)&&(t.title+' '+t.owner+' '+t.notes).toLowerCase().includes(query)).sort(compareTasks);$('rows').innerHTML=filtered.map(t=>`<tr class="${t.done?'done':isOverdue(t,today)?'overdue':''}"><td><input type="checkbox" data-id="${esc(t.id)}" data-kind="done" ${t.done?'checked':''} aria-label="Выполнено: ${esc(t.title)}"></td><td><strong class="title">${esc(t.title)}</strong><small>${esc(t.notes)}</small></td><td>${esc(t.owner||'Не назначен')}</td><td style="white-space:nowrap">${t.due?esc(t.due.split('-').reverse().join('.')):'Не указан'}${isOverdue(t,today)?'<small class="overdue-label">Просрочено</small>':''}</td><td><span class="badge ${t.priority==='Высокий'?'high':''}">${esc(t.priority)}</span></td><td>${t.action&&!t.done?'<span class="action-mark" role="img" aria-label="Требует действий" title="Требует действий">!</span>':''}</td><td class="row-actions"><button data-edit="${esc(t.id)}">Изменить</button> <button type="button" class="delete-task" data-delete="${esc(t.id)}" aria-label="Удалить задачу: ${esc(t.title)}" title="Удалить задачу">×</button></td></tr>`).join('')||'<tr><td colspan="7">Задач не найдено</td></tr>'}
const STORAGE_KEY='natcongress-tasks-v1';
const API_BASE=(window.NATCONGRESS_API_BASE||'').replace(/\/$/,'');let serverReady=false,mutationCount=0,changeGeneration=0,polling=false;
function status(text){$('syncStatus').textContent=text}
async function api(path,method='GET',body){if(!API_BASE)throw Error('Общая база ещё не подключена. Прежние данные доступны через «Скачать прежний список».');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const res=await fetch(API_BASE+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:controller.signal,cache:'no-store'});const data=await res.json();if(!res.ok){const err=Error(data.error||'Ошибка общего хранилища');err.status=res.status;throw err}return data}catch(err){if(err.name==='AbortError'||err instanceof TypeError)throw Error('Нет связи с общей базой. Изменения не сохранены — повторите попытку.');throw err}finally{clearTimeout(timer)}}
async function refreshShared(){if(polling||mutationCount)return;polling=true;const generation=changeGeneration;try{const data=await api('/api/tasks');if(generation!==changeGeneration||mutationCount)return;if(!validate(data.tasks))throw Error('Сервер вернул некорректный список');tasks=data.tasks;serverReady=true;render();status('Синхронизировано')}catch(err){status('Нет соединения');if(!serverReady)$('notice').textContent=err.message}finally{polling=false}}
async function save(task){if(!serverReady)throw Error('Дождитесь подключения к общей базе');mutationCount++;changeGeneration++;status('Сохранение…');try{const existing=Number.isSafeInteger(task.revision);const data=await api(existing?'/api/tasks/'+encodeURIComponent(task.id):'/api/tasks',existing?'PUT':'POST',{task,revision:task.revision});const idx=tasks.findIndex(t=>t.id===data.task.id);if(idx<0)tasks.push(data.task);else tasks[idx]=data.task;render();status('Синхронизировано');$('notice').textContent='Сохранено для всех участников'}catch(err){status('Изменения не сохранены');if(err.status===409)setTimeout(refreshShared,0);throw err}finally{mutationCount--;changeGeneration++}}
$('rows').onchange=async e=>{const el=e.target;if(!el.dataset.kind)return;el.disabled=true;try{const task={...tasks.find(t=>t.id===el.dataset.id),[el.dataset.kind]:el.checked};if(task.done)task.action=false;await save(task)}catch(err){$('notice').textContent=err.message;render()}};
async function deleteTask(id){const task=tasks.find(t=>t.id===id);if(!task||!serverReady)return;if(!confirm(`Действительно хотите удалить задачу «${task.title}» из общего списка для всех участников?`))return;mutationCount++;changeGeneration++;try{await api('/api/tasks/'+encodeURIComponent(id),'DELETE',{revision:task.revision});tasks=tasks.filter(t=>t.id!==id);if(editing?.id===id){editing=null;f.reset()}render();$('notice').textContent='Задача удалена из общего списка';status('Синхронизировано')}catch(err){$('notice').textContent=err.message;status('Удаление не сохранено');if(err.status===409)setTimeout(refreshShared,0)}finally{mutationCount--;changeGeneration++}}
$('rows').onclick=e=>{const deleteId=e.target.dataset.delete;if(deleteId){deleteTask(deleteId);return}const id=e.target.dataset.edit;if(!id)return;editing={...tasks.find(t=>t.id===id)};for(const k of ['title','owner','due','priority','notes'])f.elements[k].value=editing[k];f.elements.action.checked=editing.action;$('actionField').hidden=false;$('formTitle').textContent='Редактирование задачи';$('save').textContent='Сохранить';tab('new')};
f.onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{const task={id:editing?.id,revision:editing?.revision,title:f.elements.title.value.trim(),owner:f.elements.owner.value.trim(),due:f.elements.due.value,priority:f.elements.priority.value,notes:f.elements.notes.value.trim(),done:editing?.done||false,action:f.elements.action.checked};if(!task.title)throw Error('Введите название задачи');if(task.done)task.action=false;await save(task);tab('list')}catch(err){$('notice').textContent=err.message}finally{$('save').disabled=false}};
for(const id of ['search','onlyAction','hideDone'])$(id).oninput=render;

function validate(data){return Array.isArray(data)&&data.every(t=>t&&typeof t.id==='string'&&['title','owner','due','notes'].every(k=>typeof t[k]==='string')&&t.title.trim()&&['Высокий','Средний','Низкий'].includes(t.priority)&&typeof t.done==='boolean'&&typeof t.action==='boolean')&&new Set(data.map(t=>t.id)).size===data.length}
let legacyTasks=null;try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);if(validate(parsed)){legacyTasks=parsed;$('migrateLocal').hidden=false;$('exportLocal').hidden=false}}}catch(err){$('notice').textContent='Прежний список не удалось прочитать. Данные браузера не изменены.'}
function downloadTasks(data,prefix){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=prefix+'-'+todayMoscow()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').onclick=()=>{if(!serverReady){$('notice').textContent='Сначала загрузите общий список';return}downloadTasks(tasks,'natcongress-shared')};

const sameFields=(a,b)=>['title','owner','due','priority','notes','done','action'].every(k=>a[k]===b[k]);
async function importShared(data){if(!serverReady)throw Error('Дождитесь подключения к общей базе');if(!validate(data))throw Error('Некорректный файл задач');await refreshShared();const planned=data.map(item=>({source:item,current:tasks.find(t=>t.id===item.id)})).filter(x=>!x.current||!sameFields(x.source,x.current));if(!planned.length){$('notice').textContent='Все задачи уже совпадают';return}const added=planned.filter(x=>!x.current).length,updated=planned.length-added;const preview=planned.slice(0,12).map(x=>(x.current?'Изменить: ':'Добавить: ')+x.source.title).join('\n');if(!confirm(`Изменится общий список для всех участников. Добавить: ${added}, изменить: ${updated}.\n${preview}${planned.length>12?'\n…':''}\nЗадачи, которых нет в файле, не удаляются. Продолжить?`))return;let count=0;for(const item of planned){try{await save({...item.source,revision:item.current?.revision});count++}catch(err){throw Error(`Перенесено ${count} из ${planned.length}. `+err.message)}}$('notice').textContent=`Перенесено ${count} задач в общий список`;await refreshShared()}
