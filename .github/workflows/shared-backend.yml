name: Deploy shared backend
on:
  push:
    branches: [shared-sync]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/shared-api.test.mjs
      - name: Deploy Worker and D1
        run: node worker/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: backend-config
          path: config.js
